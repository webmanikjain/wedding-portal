  if (mins < 60) return `${mins} mins ago`;
  const hrs = Math.round(mins / 60);
  return hrs === 1 ? '1 hour ago' : `${hrs} hours ago`;
}
function liveStatusLabel(s) {
  const map = {
    scheduled: { text: 'Scheduled', cls: 'live-scheduled' },
    active: { text: '✈ In Air, On Time', cls: 'live-active' },
    arrival_delayed: { text: '⚠️ Arrival Delayed', cls: 'live-delayed' },
    departure_delayed: { text: '⏱ Departure Delayed', cls: 'live-delayed' },
    landed_on_time: { text: '✅ Landed, On Time', cls: 'live-landed' },
    landed_delayed: { text: '✔ Landed, Delayed', cls: 'live-landed-delayed' },
    cancelled: { text: '❌ Cancelled', cls: 'live-cancelled' },
  };
  const m = map[s.status];
  if (!m) return ''; // an unrecognized status - show nothing rather than a "no data" badge
  const detail = s.error ? ` — ${s.error}` : '';
  return `<span class="${m.cls}" title="Last updated ${agoText(s.fetchedAt)}${detail}">${m.text}</span>`;
}
// Bangkok is always UTC+7, no daylight saving - safe to hardcode the offset
// rather than rely on the viewer's own browser timezone.
function nowBangkok() {
  const utcMs = Date.now() + (new Date().getTimezoneOffset() * 60000);
  return new Date(utcMs + 7 * 60 * 60000);
}
function flightDateTime(dateStr, timeStr) {
  // dateStr like "30 Aug 2026", timeStr like "11:25" - both already Bangkok
  // local wall-clock time in the source data. Critically, we build the UTC
  // instant explicitly assuming UTC+7, rather than letting the browser's
  // OWN local timezone interpret the string - "new Date(dateStr)" silently
  // uses the viewer's local timezone for non-ISO strings like this, which
  // can shift a flight onto the wrong calendar day entirely for anyone
  // testing from outside Thailand (exactly the bug that caused a flight
  // arriving "today in Bangkok" to be silently skipped by the day filter).
  if (!dateStr) return null;
  const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const parts = dateStr.trim().split(/\s+/);
  if (parts.length < 3) return null;
  const day = parseInt(parts[0], 10);
  const month = months[parts[1]];
  const year = parseInt(parts[2], 10);
  if (isNaN(day) || month === undefined || isNaN(year)) return null;
  let h = 0, m = 0;
  if (timeStr) {
    const t = timeStr.split(':').map(Number);
    h = t[0] || 0; m = t[1] || 0;
  }
  return new Date(Date.UTC(year, month, day, h - 7, m));
}

function cssEscape(s) { return (s || '').replace(/["\\]/g, '\\$&'); }

// Parses "25 Aug 2026" directly into "2026-08-25" without ever routing
// through a Date object's local getters - sidesteps the timezone bug
// entirely, since this never asks the browser to interpret/re-extract
// anything in its own local time.
function bangkokDateKey(dateStr) {
  const months = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const parts = (dateStr || '').trim().split(/\s+/);
  if (parts.length < 3 || !months[parts[1]]) return null;
  return `${parts[2]}-${months[parts[1]]}-${String(parseInt(parts[0],10)).padStart(2,'0')}`;
}

async function refreshLiveStatus() {
  const btn = document.getElementById('refreshStatusBtn');
  if (btn) { btn.disabled = true; btn.textContent = '🔄 Refreshing…'; }
  // Check every flight scheduled for TODAY (Bangkok calendar date) - simpler
  // to reason about than a rolling hour-window, and means testing/checking
  // status doesn't depend on exactly what time you happen to click Refresh.
  const now = nowBangkok();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const uniqueFlights = new Set();
  EXPORT.arrivals.forEach(f => {
    if (!f.flightNo || !f.date) return;
    const isoDate = bangkokDateKey(f.date);
    if (!isoDate || isoDate !== todayStr) return;
    uniqueFlights.add(`${f.flightNo}|${isoDate}|${f.date}`);
  });
  if (uniqueFlights.size === 0) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Refresh Flight Status'; }
    alert('No flights arriving today (Bangkok time) - nothing to refresh.');
    return;
  }
  let done = 0, succeeded = 0, failed = 0;
  const failedFlights = [];
  for (const key of uniqueFlights) {
    const [flightNo, isoDate, origDate] = key.split('|');
    try {
      const res = await fetch(`/.netlify/functions/flight-status?flightNo=${encodeURIComponent(toIcaoIdent(flightNo))}&date=${isoDate}`);
      if (res.ok) {
        const data = await res.json();
        data.fetchedAt = Date.now();
        LIVE_STATUS[`${flightNo}|${origDate}`] = data;
        succeeded++;
      } else {
        failed++;
        failedFlights.push(flightNo);
      }
      // Failed lookups are skipped silently in the badges themselves - a "no
      // live data" badge would otherwise show up for every flight a smaller/
      // regional carrier isn't covered for, which is more noise than it's
      // worth. This summary line still reports which ones failed, though, so
      // that's distinguishable from "not checked at all" without needing
      // devtools.
    } catch (e) {
      failed++;
      failedFlights.push(flightNo);
      console.warn('flight-status lookup failed for', flightNo, e);
    }
    done++;
    if (btn) btn.textContent = `🔄 Refreshing… (${done}/${uniqueFlights.size})`;
  }
  if (btn) { btn.disabled = false; btn.textContent = '🔄 Refresh Flight Status'; }
  const debugLine = document.getElementById('refreshDebugLine');
  const failedNote = failedFlights.length ? ` (${failedFlights.join(', ')})` : '';
  if (debugLine) debugLine.textContent = `Today (Bangkok): ${todayStr} · Checked ${uniqueFlights.size} flights · ${succeeded} succeeded · ${failed} failed${failedNote}`;
  renderAll();
}

async function loadStatus() {
  try {
    const res = await fetch('/.netlify/functions/get-tracker', { cache: 'no-store' });
    const data = await res.json();
    TRACKER = { messages: data.messages || {}, transportReceived: data.transportReceived || {}, roomCheckedIn: data.roomCheckedIn || {} };
  } catch (e) { console.warn('loadStatus failed', e); }
}
async function writeTracker(body) {
  try {
    const res = await fetch('/.netlify/functions/update-tracker', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const result = await res.json();
    if (result.data) TRACKER = { messages: result.data.messages || {}, transportReceived: result.data.transportReceived || {}, roomCheckedIn: result.data.roomCheckedIn || {} };
  } catch (e) { console.warn('writeTracker failed', e); }
}
// All writes go through this queue - since the backend does a read-modify-write
// with no locking, firing overlapping requests can let one silently overwrite
// another (last-write-wins). Chaining every call onto the same promise forces
// each write to fully complete (including the server round-trip) before the
// next one starts, so rapid dropdown/checkbox changes can never race.
let writeQueue = Promise.resolve();
function queueWrite(body) {
  writeQueue = writeQueue.then(() => writeTracker(body));
  return writeQueue;
}

function baseName(n) { return (n || '').replace(/\s*\([^)]*\)\s*$/, '').trim(); }

function trackerStatus(name, field) {
  const v = ((TRACKER.messages[baseName(name)] || {})[field] || '').toLowerCase();
  if (v.startsWith('yes')) return 'sent';
  if (v.startsWith('error')) return 'error';
  if (['nopickup','nodropoff'].includes(v.replace(/[\s-]/g,''))) return 'no_pickup';
  return 'not_sent';
}
function preArrivalWelcomeStatus(name) { return trackerStatus(name, 'preArrivalWelcomeSent'); }
function markSent(name, field) {
  const key = baseName(name);
  TRACKER.messages[key] = TRACKER.messages[key] || {};
  TRACKER.messages[key][field] = 'Yes-Sent';
  queueWrite({ type: 'message', guestName: key, field, value: 'Yes-Sent' });
}
function transportReceivedStatus(name) { return !!TRACKER.transportReceived[baseName(name)]; }
function toggleTransportReceived(name, checked) {
  const key = baseName(name);
  TRACKER.transportReceived[key] = checked;
  queueWrite({ type: 'transportReceived', guestName: key, value: checked });
}
function roomCheckedInStatus(listNum) { return !!TRACKER.roomCheckedIn[String(listNum)]; }
function toggleRoomCheckedIn(listNum, checked) {
  TRACKER.roomCheckedIn[String(listNum)] = checked;
  queueWrite({ type: 'roomCheckedIn', listNum, value: checked });
}

// ---- Helpers ----
function findVan(name, direction) {
  return EXPORT.vans.find(v => v.direction === direction && v.names.includes(name));
}
function seatStatus(name) {
  const age = EXPORT.person_ages[name];
  if (age === undefined) return null;
  if (age < 5) return 'Car seat';
  if (age <= 8) return 'Booster';
  return null;
}
function personTag(name) { return EXPORT.person_tag[name] || 'Adult'; }
function extractCode(s) { const m = (s||'').match(/\(([A-Z]{3,4})\)/); return m ? m[1] : (s || 'TBC'); }
function parseAnyDate(dStr) {
  if (!dStr) return null;
  // Short room-checkIn format like "29-Aug" has no year, and new Date()
  // silently defaults to 2001 for this pattern - force the correct wedding year.
  const shortMatch = dStr.match(/^(\d{1,2})-([A-Za-z]{3,})$/);
  if (shortMatch) {
    const d = new Date(`${shortMatch[1]} ${shortMatch[2]} 2026`);
    return isNaN(d) ? null : d;
  }
  const d = new Date(dStr);
  return isNaN(d) ? null : d;
}
function daysUntil(dStr) {
  const target = parseAnyDate(dStr);
  if (!target) return null;
  return Math.ceil((target - new Date()) / (24*60*60*1000));
}
function hoursUntil(dateStr, timeStr) {
  const d = parseAnyDate(dateStr);
  if (!d || !timeStr) return null;
  const parts = timeStr.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), parts[0], parts[1]);
  return (target - new Date()) / (60 * 60 * 1000);
}
// Shows "opens in X hours" once under a day remains, rather than always
// rounding up to "1 day" - matches index.html's identical helper.
function formatTimeRemaining(hoursRemaining) {
  if (hoursRemaining < 24) {
    const h = Math.max(1, Math.ceil(hoursRemaining));
    return h === 1 ? '1 hour' : `${h} hours`;
  }
  const d = Math.ceil(hoursRemaining / 24);
  return d === 1 ? '1 day' : `${d} days`;
}
function fmtDateFull(room) { return room && room.checkIn ? room.checkIn : 'TBC'; }

function cleanPhone(p) { return p ? p.replace(/[^0-9]/g, '') : ''; }

// ---- Build unified chronological arrival slots ----
function buildDaySlots() {
  const byDate = {};
  const seenNames = new Set();

  EXPORT.vans.forEach(v => {
    if (!v.date) return;
    const isOwn = v.van_id.startsWith('OWN');
    byDate[v.date] = byDate[v.date] || [];
    byDate[v.date].push({ time: v.time || '23:59', van_id: v.van_id, names: v.names, own: isOwn });
    v.names.forEach(n => seenNames.add(baseName(n)));
  });

  // Any arrival leg not covered by a van entry (rare data gaps) - show individually
  EXPORT.arrivals.forEach(f => {
    if (seenNames.has(baseName(f.name)) || !f.date) return;
    byDate[f.date] = byDate[f.date] || [];
    byDate[f.date].push({ time: f.time || '23:59', van_id: null, names: [f.name], own: true });
    seenNames.add(f.name);
  });

  Object.keys(byDate).forEach(date => byDate[date].sort((a, b) => a.time.localeCompare(b.time)));
  return byDate;
}

// FlightAware's public /live/flight/ URLs are indexed by ICAO airline code
// (e.g. "THA314"), not the IATA code shown on tickets (e.g. "TG314") - a
// direct IATA-style link 404s for most airlines. Mapping covers every
// airline appearing in this event's flight data.
const IATA_TO_ICAO = {
  AI: 'AIC', OS: 'AUA', PG: 'BKP', B3: 'BTN', CX: 'CPA', '5J': 'CEB',
  DL: 'DAL', BR: 'EVA', EK: 'UAE', EY: 'ETD', '6E': 'IGO', JL: 'JAL',
  KE: 'KAL', QR: 'QTR', TR: 'TGW', SQ: 'SIA', '9C': 'CQH', LX: 'SWR',
  TG: 'THA', SL: 'TLM', VZ: 'TVJ', TK: 'THY', UA: 'UAL', ZG: 'TZP',
};
// FlightAware's API (not just its public website) expects the ICAO-style
// ident (e.g. "THA314"), not the IATA code printed on tickets (e.g.
// "TG314") - confirmed directly: querying with the raw ticket number fails
// to match, while the converted ident succeeds.
function toIcaoIdent(flightNo) {
  if (!flightNo) return flightNo;
  const m = flightNo.match(/^([A-Z0-9]{2})(\d+)$/);
  const icao = m ? IATA_TO_ICAO[m[1]] : null;
  return (m && icao) ? `${icao}${m[2]}` : flightNo; // fall back to raw code if airline isn't mapped
}
function flightAwareLink(flightNo, dateStr, timeStr) {
  if (!flightNo) return null;
  const ident = toIcaoIdent(flightNo);

  // Completed flights: /history listing is reliable, shows every past
  // occurrence for the guest to pick their actual date from.
  // Upcoming flights: rather than a direct /live/ link (which can still be
  // ambiguous - codeshares, near-duplicate idents), send to FlightAware's
  // blank search page and copy the flight number to the clipboard so the
  // planner just pastes it in themselves. No guessing, no wrong-flight risk.
  const scheduled = flightDateTime(dateStr, timeStr);
  const isUpcoming = scheduled && scheduled >= nowBangkok();
  if (isUpcoming) {
    return { copyOnly: true, ident };
  }
  return { copyOnly: false, url: `https://flightaware.com/live/flight/${encodeURIComponent(ident)}/history` };
}

function renderPassengerRow(rawName) {
  const name = baseName(rawName); // strip "(Infant)"/"(Staff)" annotations before any lookup
  const leg = EXPORT.arrivals.find(f => f.name === name);
  const roomListNum = EXPORT.rooms_by_name[name]; // undefined for staff with no own room - expected, not a bug
  const room = roomListNum !== undefined ? (EXPORT.rooms[String(roomListNum)] || {}) : {};
  const tag = personTag(name);
  const seat = seatStatus(name);
  const contact = EXPORT.contacts[name];
  const kidBadge = tag !== 'Adult' ? `<span class="tag-badge">${tag}</span>` : '';
  const isDomesticArrival = leg && leg.origin && leg.origin.includes('Phuket');
  const seatBadge = seat ? `<span class="seat-badge">${seat}</span>` : '';
  const contactCell = contact ? `<a href="https://api.whatsapp.com/send?phone=${cleanPhone(contact)}" target="_blank" class="wa-icon" title="Click to WhatsApp ${contact}">💬</a>` : '<span class="muted">—</span>';
  const originCode = extractCode(leg ? leg.origin : '');
  const destCode = extractCode(leg ? leg.destination : '');
  const tooltip = leg ? `${leg.airline||''} — ${leg.origin||''} to ${leg.destination||''}` : '';
  const hotelLink = portalLink(name, true);
  const nameLink = portalLink(name, true);
  const nameCell = nameLink ? `<a href="${nameLink}" target="_blank" class="name-link">${name}</a>` : name; // staff: plain text, no portal page to link to

  const noPickup = !leg || (leg.pickup && leg.pickup.trim().startsWith('N'));
  const arrivedCell = noPickup ? '<td class="center"><span class="muted">N/A</span></td>'
    : `<td class="center"><input type="checkbox" class="arrived-check" data-guest="${name.replace(/"/g,'&quot;')}" ${transportReceivedStatus(name) ? 'checked' : ''}></td>`;

  const gateTimeStr = leg && leg.date && leg.time ? leg.time : '12:00';
  const hoursOutPW = leg ? hoursUntil(leg.date, gateTimeStr) : (room.checkIn ? hoursUntil(room.checkIn, '12:00') : null);
  const tooEarly = hoursOutPW !== null && hoursOutPW > 72;
  const pStatus = preArrivalWelcomeStatus(name);
  const authMsg = EXPORT.wa_prearrival_welcome_msg[name];
  const authPhone = EXPORT.wa_prearrival_welcome_phone[name];
  const msg = authMsg || fallbackPreArrivalMsg(name, leg);
  const phone = authPhone || contact;
  const waLink = phone ? `https://api.whatsapp.com/send?phone=${cleanPhone(phone)}&text=${encodeURIComponent(msg)}` : null;

  let prearrivalCell;
  if (pStatus === 'error') {
    prearrivalCell = `<td class="prearrival-cell">
      <select class="statusSelect err" data-guest="${name.replace(/"/g,'&quot;')}" data-field="preArrivalWelcomeSent">
        <option value="Ok to send">Ok to send</option>
        <option value="Yes-Sent">Yes-Sent</option>
        <option value="Error wait" selected>Error wait</option>
      </select>
      <span class="blocked-badge" title="Marked Error wait - change the dropdown to un-block">🚫 BLOCKED</span>
    </td>`;
  } else if (tooEarly && pStatus !== 'sent') {
    prearrivalCell = `<td class="prearrival-cell"><span class="waiting-badge">⏳ Opens in ${formatTimeRemaining(hoursOutPW - 72)}</span></td>`;
  } else {
    const selCls = pStatus === 'sent' ? 'yes' : 'oksend';
    const btnLabel = (pStatus === 'sent' ? 'Re-send' : 'Send') + (isDomesticArrival ? ' (Domestic)' : '');
    prearrivalCell = `<td class="prearrival-cell">
      <select class="statusSelect ${selCls}" data-guest="${name.replace(/"/g,'&quot;')}" data-field="preArrivalWelcomeSent">
        <option value="Ok to send" ${pStatus!=='sent'?'selected':''}>Ok to send</option>
        <option value="Yes-Sent" ${pStatus==='sent'?'selected':''}>Yes-Sent</option>
        <option value="Error wait">Error wait</option>
      </select>
      ${waLink ? `<button class="send-btn-mini pre-arrival-send" data-wa="${waLink}" data-guest="${name.replace(/"/g,'&quot;')}">${btnLabel}</button>` : ''}
    </td>`;
  }

  const checkedIn = roomListNum !== undefined && roomCheckedInStatus(roomListNum);
  const arrived = !noPickup && transportReceivedStatus(name);
  const rowClass = checkedIn ? 'row-checkedin' : (arrived ? 'row-arrived' : '');
  const hotelLinkHtml = roomListNum === undefined ? '<span class="muted">N/A</span>'
    : (room.confirmation ? `<a href="${hotelLink}" target="_blank" class="hotel-link" title="Open portal page with hotel details expanded">🏨 ${room.confirmation}</a>` : '<span class="muted">TBC</span>');
  const checkinDateVal = roomListNum === undefined ? null : (EXPORT.rooms[String(roomListNum)] && EXPORT.rooms[String(roomListNum)].checkIn);
  const confirmCheckinCell = roomListNum === undefined ? '<span class="muted">—</span>'
    : `<span class="checkin-combo"><span class="checkin-date">${checkinDateVal || 'TBC'}</span><input type="checkbox" class="checkedin-check" data-room="${roomListNum}" ${checkedIn ? 'checked' : ''}>${hotelLinkHtml}</span>`;
  const flightArrivalCell = leg && leg.date ? `${leg.date.split(' ').slice(0,2).join('-')}: ${leg.time || 'TBC'}` : 'TBC';
  const flightKey = leg ? `${leg.flightNo}|${leg.date}` : null;
  const liveStatus = flightKey ? LIVE_STATUS[flightKey] : null;
  const liveStatusBadge = leg && leg.flightNo
    ? `<span class="live-status-badge" data-flightno="${leg.flightNo || ''}" data-date="${leg.date ? new Date(leg.date).toISOString().slice(0,10) : ''}">${liveStatus ? liveStatusLabel(liveStatus) : ''}</span>`
    : '';

  return `<tr class="${rowClass}" data-search="${name.toLowerCase()}" data-status="${pStatus}">
    ${prearrivalCell}
    <td class="name-cell" title="Click for details">${nameCell}${kidBadge}${seatBadge}</td>
    <td class="center">${contactCell}</td>
    <td title="${tooltip}">${(() => {
      if (!leg || !leg.flightNo) return noPickup ? 'Own arrangements' : 'TBC';
      const fa = flightAwareLink(leg.flightNo, leg.date, leg.time);
      if (fa.copyOnly) {
        return `<a href="https://www.flightaware.com/live/" target="_blank" class="flight-link flight-link-copy" data-flightno="${fa.ident}" title="Copy flight number to check status on FlightAware">${leg.flightNo}</a>`;
      }
      return `<a href="${fa.url}" target="_blank" class="flight-link" title="Check flight status history">${leg.flightNo}</a>`;
    })()}</td>
    ${arrivedCell}
    <td title="${tooltip}">${leg ? `${originCode} → ${destCode}` : ''}</td>
    <td>${flightArrivalCell}${liveStatusBadge}</td>
    <td>${confirmCheckinCell}</td>
  </tr>`;
}

  renderAll();
}
function slotKey(slot) { return slot.van_id || `own-${slot.names[0]}`; }
function isSlotComplete(slot) {
  return slot.names.every(rawName => {
    const name = baseName(rawName);
    const leg = EXPORT.arrivals.find(f => f.name === name);
    const noPickupPerson = !leg || (leg.pickup && leg.pickup.trim().startsWith('N'));
    if (slot.own || noPickupPerson) {
      const roomListNum = EXPORT.rooms_by_name[name];
      return roomListNum === undefined || roomCheckedInStatus(roomListNum);
    }
    return transportReceivedStatus(name);
  });
}
function toggleVanCollapse(key) {
  if (MANUALLY_EXPANDED.has(key)) MANUALLY_EXPANDED.delete(key);
  else MANUALLY_EXPANDED.add(key);
  renderAll();
}

function renderSlot(slot) {
  const key = slotKey(slot);
  const complete = isSlotComplete(slot);
  const searchBox = document.getElementById('guestSearch');
  const statusBox = document.getElementById('statusFilter');
  const filterActive = (searchBox && searchBox.value.trim().length > 0) || (statusBox && statusBox.value);
  const collapsed = complete && !MANUALLY_EXPANDED.has(key) && !filterActive;
  const firstLeg = EXPORT.arrivals.find(f => f.name === baseName(slot.names[0]));
  const isDomestic = firstLeg && firstLeg.origin && firstLeg.origin.includes('Phuket');
  const domesticBadge = isDomestic ? ` <span class="domestic-badge">✈ DOMESTIC</span>` : '';
  const headerClass = slot.own ? 'own-header' : 'van-header';
  const label = (slot.own ? '🚗 Own Arrangements' : `🚐 ${slot.van_id}`) + domesticBadge;
  const timeLabel = slot.own ? 'No Pickup' : `Estd. Pick up: ${slot.time} hrs`;

  if (collapsed) {
    return `<div class="van-card van-collapsed ${slot.own ? 'own-arrangement' : ''}">
      <div class="${headerClass}" onclick="toggleVanCollapse('${key.replace(/'/g,"\\'")}')"><span>${label} <span class="done-badge">✅ All done (${slot.names.length}/${slot.names.length})</span></span><span>▸</span></div>
    </div>`;
  }
  const rows = slot.names.map(renderPassengerRow).join('');
  return `<div class="van-card ${slot.own ? 'own-arrangement' : ''}">
    <div class="${headerClass}" onclick="${complete ? `toggleVanCollapse('${key.replace(/'/g,"\\'")}')` : ''}"><span>${label}</span><span>${timeLabel}${complete ? ' ▾' : ''}</span></div>
    <div class="table-wrap"><table class="pax-table">${tableHead()}<tbody>${rows}</tbody></table></div>
  </div>`;
}

function fmtDayHeader(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });
}
function fmtDayNavLabel(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-US', { weekday: 'long' });
  const day = d.getDate();
  const month = d.toLocaleDateString('en-US', { month: 'short' });
  return `${weekday} ${day}-${month}`;
}

let DAY_SLOTS = {};
let SORTED_DATES = [];

function renderAll() {
  const main = document.getElementById('main');
  const dayHtml = SORTED_DATES.map(date => {
    const vanSlots = DAY_SLOTS[date].filter(s => !s.own);
    if (!vanSlots.length) return '';
    const count = vanSlots.reduce((n,s)=>n+s.names.length,0);
    const searchBox = document.getElementById('guestSearch');
    const statusBox = document.getElementById('statusFilter');
    const filterActive = (searchBox && searchBox.value.trim().length > 0) || (statusBox && statusBox.value);
    const dayCollapsed = COLLAPSED_DAYS.has(date) && !filterActive;
    return `
    <div class="day-section" data-date="${date}">
      <div class="day-header" onclick="toggleDayCollapse('${date}')">${fmtDayHeader(date)} · ${count} arriving <span style="float:right;">${dayCollapsed ? '▸' : '▾'}</span></div>
      ${dayCollapsed ? '' : vanSlots.map(renderSlot).join('')}
    </div>`;
  }).join('');

  // All Own Arrangements, across every day, consolidated into one section at the bottom - chronological by actual date+time
  const allOwnSlots = [];
  SORTED_DATES.forEach(date => {
    DAY_SLOTS[date].filter(s => s.own).forEach(s => allOwnSlots.push({ ...s, date, sortKey: date + ' ' + s.time }));
  });
  allOwnSlots.sort((a, b) => new Date(a.sortKey) - new Date(b.sortKey));
  const ownCount = allOwnSlots.reduce((n,s)=>n+s.names.length,0);
  const ownHtml = allOwnSlots.length ? `
    <div class="day-section" id="own-arrangements-section">
      <div class="own-section-header">🚗 Own Arrangements — All Days · ${ownCount} arriving</div>
      ${allOwnSlots.map(renderSlot).join('')}
    </div>` : '';

  main.innerHTML = dayHtml + ownHtml;
  applyFilters();
  updateHeaderHeightVar();
}

function renderDayNav() {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = `<select id="daySelect">${SORTED_DATES.map(date => `<option value="${date}">${fmtDayNavLabel(date)}</option>`).join('')}</select>`;
  document.getElementById('daySelect').addEventListener('change', (e) => {
    const section = document.querySelector(`.day-section[data-date="${e.target.value}"]`);
    if (section) section.scrollIntoView({ behavior: 'smooth' });
  });
}

function findTodayOrNextSortedDate() {
  const now = nowBangkok();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  return SORTED_DATES.find(d => bangkokDateKey(d) >= todayStr) || SORTED_DATES[SORTED_DATES.length - 1];
}

function scrollToTodayOrNext() {
  const targetDate = findTodayOrNextSortedDate();
  if (!targetDate) return;
  const section = document.querySelector(`.day-section[data-date="${targetDate}"]`);
  if (section) section.scrollIntoView({ behavior: 'auto' });
  const daySelect = document.getElementById('daySelect');
  if (daySelect) daySelect.value = targetDate;
}

async function init() {
  await loadStatus();
  DAY_SLOTS = buildDaySlots();
  SORTED_DATES = Object.keys(DAY_SLOTS).sort((a,b) => new Date(a) - new Date(b));
  renderDayNav();
  renderAll();
  // Jump straight to today's arrivals (or the next upcoming day, if none
  // today) rather than always starting at the very first day of the event -
  // avoids confusion with already-completed earlier days.
  scrollToTodayOrNext();
  // Auto-check today's flight statuses on load, so the planner doesn't have
  // to remember to tap Refresh every time they open the page. Re-apply the
  // scroll position once this finishes too, since it triggers a re-render.
  await refreshLiveStatus();
  scrollToTodayOrNext();
}

document.addEventListener('change', (e) => {
  const arrived = e.target.closest('.arrived-check');
  if (arrived) {
    const guest = arrived.dataset.guest;
    toggleTransportReceived(guest, arrived.checked);
    renderAll();
    pulseCheckbox(`.arrived-check[data-guest="${cssEscape(guest)}"]`);
    return;
  }
  const checkedin = e.target.closest('.checkedin-check');
  if (checkedin) {
    const room = checkedin.dataset.room;
    toggleRoomCheckedIn(parseInt(room), checkedin.checked);
    renderAll();
    pulseCheckbox(`.checkedin-check[data-room="${room}"]`);
    return;
  }
  const sel = e.target.closest('.statusSelect[data-guest]');
  if (sel) {
    const key = baseName(sel.dataset.guest);
    TRACKER.messages[key] = TRACKER.messages[key] || {};
    TRACKER.messages[key][sel.dataset.field] = sel.value;
    queueWrite({ type: 'message', guestName: key, field: sel.dataset.field, value: sel.value });
    renderAll();
  }
});
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.pre-arrival-send');
  if (btn) {
    window.open(btn.dataset.wa, '_blank');
    markSent(btn.dataset.guest, 'preArrivalWelcomeSent');
    renderAll();
    return;
  }
  const copyLink = e.target.closest('.flight-link-copy');
  if (copyLink) {
    const ident = copyLink.dataset.flightno;
    if (navigator.clipboard && ident) {
      navigator.clipboard.writeText(ident).then(() => {
        const original = copyLink.textContent;
        copyLink.textContent = `✅ Copied "${ident}"`;
        setTimeout(() => { copyLink.textContent = original; }, 2000);
      }).catch(() => {});
    }
    // Link still navigates to the blank FlightAware search page via its href/target
  }
});

function applyFilters() {
  const clearBtn = document.getElementById('clearSearchBtn');
  const term = document.getElementById('guestSearch').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  if (!term && !status) {
    document.querySelectorAll('[data-search]').forEach(row => row.style.display = '');
    document.querySelectorAll('.van-card').forEach(card => card.style.display = '');
    document.querySelectorAll('.day-section').forEach(sec => sec.style.display = '');
    clearBtn.style.display = 'none';
    return;
  }
  clearBtn.style.display = '';
  document.querySelectorAll('[data-search]').forEach(row => {
    const nameMatch = !term || row.dataset.search.includes(term);
    const statusMatch = !status || row.dataset.status === status;
    row.style.display = (nameMatch && statusMatch) ? '' : 'none';
  });
  document.querySelectorAll('.van-card').forEach(card => {
    const anyVisible = Array.from(card.querySelectorAll('[data-search]')).some(row => row.style.display !== 'none');
    card.style.display = anyVisible ? '' : 'none';
  });
  document.querySelectorAll('.day-section').forEach(sec => {
    const anyVisible = Array.from(sec.querySelectorAll('.van-card')).some(card => card.style.display !== 'none');
    sec.style.display = anyVisible ? '' : 'none';
  });
}
function clearGuestSearch() {
  document.getElementById('guestSearch').value = '';
  document.getElementById('statusFilter').value = '';
  applyFilters();
}
document.getElementById('guestSearch').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);

init();
</script>
</body></html>
