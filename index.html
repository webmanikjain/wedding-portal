<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner's Portal — Live Data Demo</title>
<style>
  :root {
    --navy:#1F3864; --gold:#C9A24B; --green:#2f7d4f; --amber:#8a5a12;
    --paper:#f7f5f0; --card-bg:#ffffff; --line:#e6e2d6; --line-strong:#b9b2a0; --muted:#767267;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family:'Segoe UI', Helvetica, Arial, sans-serif; background:var(--paper); margin:0; color:#26282b; font-size:15px; }
  header { background:var(--navy); color:#fff; padding:16px; }
  header h1 { margin:0 0 2px; font-size:1.15rem; font-weight:600; }
  header .sub { font-size:0.8rem; color:#cfd8e6; }
  .banner { background:#fff4d6; border-bottom:1px solid var(--gold); padding:8px 16px; font-size:0.78rem; color:#5c4a12; }
  .wrap { max-width:600px; margin:0 auto; padding:16px; }

  .search { position:relative; margin-bottom:16px; }
  .search input { width:100%; padding:13px 14px; font-size:1rem; border:1px solid var(--line-strong); border-radius:8px; }
  .search-results { border:1px solid var(--line-strong); border-top:none; border-radius:0 0 8px 8px; background:#fff; overflow:hidden; display:none; }
  .search-results.show { display:block; }
  .search-results .res-room { padding:10px 14px; border-bottom:1px solid var(--line); font-size:0.9rem; cursor:pointer; }
  .search-results .res-room:last-child { border-bottom:none; }
  .search-results .res-room:hover { background:#faf7ef; }
  .search-results .res-room span { margin-right:10px; }
  .search-results .res-room span.match { font-weight:700; color:var(--navy); }
  .search-hint { font-size:0.75rem; color:var(--muted); margin-top:6px; }
  .no-results { padding:12px 14px; font-size:0.85rem; color:var(--muted); }

  .card { background:var(--card-bg); border:1px solid var(--line); border-radius:12px; padding:20px; display:none; }
  .card.show { display:block; }
  .card h2 { margin:0 0 18px; font-size:1.3rem; color:var(--navy); font-weight:700; font-family:Georgia,'Times New Roman',serif; }

  .section-label { display:flex; align-items:center; gap:7px; font-size:0.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); font-weight:700; margin:24px 0 10px; }
  .section-label:first-of-type { margin-top:0; }

  .field-row { display:flex; justify-content:space-between; align-items:baseline; font-size:0.92rem; padding:6px 0; gap:12px; border-bottom:1px solid var(--line); }
  .field-row:last-of-type { border-bottom:none; }
  .field-row .k { color:var(--muted); }
  .field-row .v { text-align:right; font-weight:600; }
  .field-row .v.flag { color:var(--amber); }
  .field-row .v.ok { color:var(--green); }
  .field-row .v a { color:var(--navy); }

  .btn { display:block; width:100%; background:var(--navy); color:#fff; border:none; padding:12px 14px; border-radius:8px; font-size:0.92rem; font-weight:600; cursor:pointer; text-align:center; min-height:44px; text-decoration:none; }
  .btn:hover { background:#162a4a; }
  .send-row { display:flex; align-items:center; gap:10px; margin:4px 0 20px; }
  .send-row .btn { flex:1; }
  .send-row .check { display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); flex-shrink:0; }
  .send-row .check input { width:20px; height:20px; }

  input[type="checkbox"] { accent-color: var(--green); }
  .task-card { border:1px solid var(--line-strong); border-radius:10px; padding:14px; margin-bottom:10px; transition: opacity .2s, background .2s; }
  .task-card.done { border-color:var(--line); background:#f3f2ee; opacity:0.72; }
  .task-card .task-title { font-weight:700; color:var(--navy); font-size:0.94rem; margin-bottom:8px; }
  .task-card.done .task-title { color:#5a5850; }
  .task-card .task-facts { font-size:0.88rem; color:#3d3a33; line-height:1.55; margin-bottom:12px; }
  .task-card .task-facts .fact-line { display:block; }
  .task-card .task-facts .fact-label { color:var(--muted); }
  .fact-line { display:block; }
  .task-card ul.guest-list, .info-card ul.guest-list { list-style:none; margin:0 0 12px; padding:0; font-size:0.88rem; }
  .task-card ul.guest-list li, .info-card ul.guest-list li { padding:5px 0; border-bottom:1px dotted var(--line); }
  .task-card ul.guest-list li:last-child, .info-card ul.guest-list li:last-child { border-bottom:none; }
  .task-card ul.guest-list li .tag, .info-card ul.guest-list li .tag { color:var(--amber); font-weight:600; }
  .task-card ul.guest-list li.self, .info-card ul.guest-list li.self { font-weight:700; }
  .task-check-row { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); padding-top:10px; }
  .task-check-row input { width:22px; height:22px; flex-shrink:0; }
  .task-check-row label { font-size:0.9rem; font-weight:600; color:var(--amber); }
  .task-card.done .task-check-row label { color:var(--green); }
  .task-card.done .task-check-row label::before { content:"✓ "; }

  .info-card { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; background:#faf9f5; }
  .info-card .task-title { font-weight:700; color:var(--navy); font-size:0.94rem; margin-bottom:8px; }
  .info-card .task-facts { font-size:0.88rem; color:#3d3a33; line-height:1.55; }
  .info-card .task-facts .fact-label { color:var(--muted); }

  .card-nav { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--line); }
  .card-nav button { flex:1; background:#fff; border:1px solid var(--line-strong); color:var(--navy); padding:11px 12px; border-radius:8px; font-size:0.86rem; font-weight:600; cursor:pointer; min-height:44px; }
  .card-nav button:disabled { opacity:0.4; cursor:default; }
  .card-nav .nav-pos { font-size:0.74rem; color:var(--muted); white-space:nowrap; }
  footer.note { max-width:600px; margin:0 auto; padding:16px 16px 32px; font-size:0.78rem; color:#8a8577; }
.hotel-collapsible.collapsed { display: none; }
@keyframes tapConfirmPulse { 0% { transform:scale(1); box-shadow:0 0 0 0 rgba(26,92,42,0.5); } 40% { transform:scale(1.15); box-shadow:0 0 0 8px rgba(26,92,42,0); } 100% { transform:scale(1); box-shadow:0 0 0 0 rgba(26,92,42,0); } }
.tap-confirm { animation: tapConfirmPulse 0.5s ease-out; border-radius:6px; }
</style>
</head>

<header>
  <h1>Planner's Portal</h1>
  <div class="sub">Ratnam & Rohit · Bangkok · Internal use only</div>
  <a href="arrivals.html" style="display:inline-block;margin-top:8px;padding:8px 14px;background:#2c2416;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;">🕐 Go to Arrival Summary Tracker</a>

  <div class="card" id="card"></div>
</div>

// ---- Hotel Confirmation status (read-only) ----
// Planners mark this directly in a shared Google Sheet (a live copy of
// WhatsApp_Direct_Links.csv with a "Hotel Confirmation Sent" column added) —
// there is no write-back from this portal. Editing a Sheet directly works
// identically for every planner regardless of location, browser, or network,
// which a JS-driven write to Apps Script could not reliably guarantee.
// Tracking now lives in Netlify Blobs via two Functions on this same site:
//   GET  /.netlify/functions/get-tracker    -> full state JSON
//   POST /.netlify/functions/update-tracker -> writes one field, returns updated state
// No Google Sheets, no CORS, no publish-cache delay.
const TRACKER = { messages: {}, transportReceived: {}, roomCheckedIn: {} };

async function loadStatus() {
  try {
    const res = await fetch('/.netlify/functions/get-tracker', { cache: 'no-store' });
    const data = await res.json();
    TRACKER.messages = data.messages || {};
    TRACKER.transportReceived = data.transportReceived || {};
    TRACKER.roomCheckedIn = data.roomCheckedIn || {};
  } catch (e) {
    console.warn('Could not load tracker state:', e);
  }
}

async function writeTracker(body) {
  try {
    const res = await fetch('/.netlify/functions/update-tracker', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const result = await res.json();
    if (result.data) {
      TRACKER.messages = result.data.messages || {};
      TRACKER.transportReceived = result.data.transportReceived || {};
      TRACKER.roomCheckedIn = result.data.roomCheckedIn || {};
    }
  } catch (e) {
    console.warn('Could not write tracker state:', e);
  }
}
// All writes are chained onto this single queue so overlapping requests can
// never race - the backend does a read-modify-write with no locking, so two
// near-simultaneous writes could otherwise silently drop one change.
let writeQueue = Promise.resolve();
function queueWrite(body) {
  writeQueue = writeQueue.then(() => writeTracker(body));
  return writeQueue;
}

// markSent() is called the moment a Send button is clicked - no separate
// manual step. Fire-and-forget: don't block opening WhatsApp on the write.
function markSent(guestName, field) {
  const key = baseName(guestName);
  TRACKER.messages[key] = TRACKER.messages[key] || {};
  TRACKER.messages[key][field] = 'Yes-Sent'; // update local state immediately for instant UI feedback
  queueWrite({ type: 'message', guestName: key, field, value: 'Yes-Sent' });
}

function trackerStatus(name, field) {
  const v = ((TRACKER.messages[baseName(name)] || {})[field] || '').toLowerCase();
  if (v.startsWith('yes')) return 'sent';
  if (v.startsWith('error')) return 'error';
  if (['nopickup', 'nodropoff'].includes(v.replace(/[\s-]/g, ''))) return 'no_pickup';
  return 'not_sent';
}
function hotelConfirmationStatus(name) { return trackerStatus(name, 'hotelConfirmationSent'); }
function flightConfirmationStatus(name) { return trackerStatus(name, 'flightConfirmationSent'); }
function preArrivalWelcomeStatus(name) { return trackerStatus(name, 'preArrivalWelcomeSent'); }
function preDepartureReminderStatus(name) { return trackerStatus(name, 'preDepartureReminderSent'); }

function transportReceivedStatus(name) { return !!TRACKER.transportReceived[baseName(name)]; }
function toggleTransportReceived(name, checked) {
  const key = baseName(name);
  TRACKER.transportReceived[key] = checked;
  queueWrite({ type: 'transportReceived', guestName: key, value: checked });
}

function roomCheckedInStatus(listNum) { return !!TRACKER.roomCheckedIn[String(listNum)]; }
function toggleRoomCheckedIn(listNum, checked) {
  TRACKER.roomCheckedIn[String(listNum)] = checked;
  queueWrite({ type: 'roomCheckedIn', listNum, value: checked });
}

function fmtDateFull(dStr) {
  // dStr like "27-Aug" or "1-Sep" -> "Thu, 27 August"
  const [day, mon] = dStr.split('-');
  const months = {Aug:'August', Sep:'September'};
  const monthNum = {Aug:7, Sep:8};
  const dt = new Date(2026, monthNum[mon], parseInt(day));
  const wd = dt.toLocaleDateString('en-US', {weekday:'short'});
  return `${wd}, ${parseInt(day)} ${months[mon]}`;
}
function parseAnyDate(dStr) {
  // Handles both "29 Aug 2026" (flight leg dates) and "29-Aug" (room dates,
  // year assumed 2026 — the only year this wedding spans).
  if (!dStr) return null;
  if (dStr.includes('-') && !dStr.match(/\d{4}/)) {
    const [day, mon] = dStr.split('-');
    const monthNum = {Aug:7, Sep:8};
    if (!(mon in monthNum)) return null;
    return new Date(2026, monthNum[mon], parseInt(day));
  }
  const d = new Date(dStr);
  return isNaN(d) ? null : d;
}

}

  if (parts.some(isNaN)) return null;
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), parts[0], parts[1]);
  return (target - new Date()) / (60 * 60 * 1000);
}
// Shows "opens in X hours" once under a day remains, rather than always
// rounding up to "1 day" - much clearer close to the actual gate time.
function formatTimeRemaining(hoursRemaining) {
  if (hoursRemaining < 24) {
    const h = Math.max(1, Math.ceil(hoursRemaining));
    return h === 1 ? '1 hour' : `${h} hours`;
  }
  const d = Math.ceil(hoursRemaining / 24);
  return d === 1 ? '1 day' : `${d} days`;
}
function fmtGuestPaidDate(dStr) {
  // dStr like "27 Aug" (space-separated, from guestPaidDates) -> "Thu, 27 Aug"
  const [day, mon] = dStr.split(' ');
  const monthNum = {Aug:7, Sep:8};
  const dt = new Date(2026, monthNum[mon], parseInt(day));
  const wd = dt.toLocaleDateString('en-US', {weekday:'short'});
  return `${wd}, ${day} ${mon}`;
}
function nightsBetween(ci, co) {
  const [d1,m1] = ci.split('-'); const [d2,m2] = co.split('-');
  const monthNum = {Aug:7, Sep:8};
  const dt1 = new Date(2026, monthNum[m1], parseInt(d1));
  const dt2 = new Date(2026, monthNum[m2], parseInt(d2));
  return Math.round((dt2 - dt1) / 86400000);
}
function getLinkedRooms(room) {

  if (!room.links) return [];

}

function findVan(name, direction) {

function allRoomsMatching(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return DATA.rooms.filter(r => {
    const names = r.guests.map(g => g[1].toLowerCase());
    if (r.child) names.push(...splitNames(r.child[1]).map(n => n.toLowerCase()));
    if (r.infant) names.push(...splitNames(r.infant[0]).map(n => n.toLowerCase()));
    return names.some(n => n.includes(q));
  });
}

function renderSearchResults(query) {
  const box = document.getElementById('searchResults');
  const rooms = allRoomsMatching(query);
  if (!query.trim()) { box.classList.remove('show'); box.innerHTML = ''; return; }
  if (!rooms.length) {
    box.innerHTML = '<div class="no-results">No guest matches "' + query.replace(/</g,'') + '"</div>';
    box.classList.add('show');
    return;
  }
  const q = query.trim().toLowerCase();
  box.innerHTML = rooms.map(r => {
    const names = r.guests.map(g => g[1]).concat(r.child ? splitNames(r.child[1]) : []).concat(r.infant ? splitNames(r.infant[0]) : []);
    const matchingNames = names.filter(n => n.toLowerCase().includes(q));
    const shownNames = matchingNames.length ? matchingNames : names; // fallback safety net
    const spans = shownNames.map(n => `<span class="match" data-name="${n.replace(/"/g,'&quot;')}">${n}</span>`).join('');
    const matchedName = shownNames[0];
    return `<div class="res-room" data-list="${r.listNum}" data-matched-name="${matchedName.replace(/"/g,'&quot;')}">${spans}</div>`;
  }).join('');
  box.classList.add('show');
  box.querySelectorAll('.res-room').forEach(el => {
    el.addEventListener('click', (e) => {
      // If they clicked directly on a specific name span, use that guest;
      // otherwise fall back to whichever name matched the search query.
      const clickedName = e.target.dataset && e.target.dataset.name ? e.target.dataset.name : el.dataset.matchedName;
      renderCard(parseInt(el.dataset.list), clickedName);
      box.classList.remove('show');
      document.getElementById('searchInput').value = '';
    });
  });
}

  const authPWPhone = DATA.wa_prearrival_welcome_phone ? DATA.wa_prearrival_welcome_phone[baseName(repName)] : null;
  const prearrivalWelcomeMsg = authPWMsg || MSGS.preArrivalWelcome(repName, room, arrLeg);
  const prearrivalWelcomeWa = waLink(authPWPhone || primaryPhone, prearrivalWelcomeMsg);
  // Gate: stays disabled until 60 hours before the guest's arrival (falls
  // back to room check-in date, assuming a 12:00 default time, if there's no
  // flight on file - e.g. self-arranged guests). Doesn't override an
  // already-Sent or Error status - those still display normally regardless
  // of timing.
  const gateDateStr = arrLeg && arrLeg.date ? arrLeg.date : room.checkIn;
  const gateTimeStr = arrLeg && arrLeg.date && arrLeg.time ? arrLeg.time : '12:00';
  const hoursOutPW = hoursUntil(gateDateStr, gateTimeStr);
  const tooEarly = hoursOutPW !== null && hoursOutPW > 72;
  const isDomesticArrival = arrLeg && arrLeg.origin && arrLeg.origin.includes('Phuket');
  const preArrivalWelcomeRow = `<div class="send-row" id="action-prearrival">
      ${(() => {
        const status = preArrivalWelcomeStatus(repName);
        const domesticSuffix = isDomesticArrival ? ' (Domestic)' : '';
        if (status === 'error') return `<button class="btn" disabled style="opacity:.5;">Blocked — check status</button>`;
        if (status === 'sent') return prearrivalWelcomeWa ? `<button class="btn send-btn" data-wa="${prearrivalWelcomeWa}" data-track-guest="${baseName(repName)}" data-track-field="preArrivalWelcomeSent" style="background:#8d8a7f;opacity:.75;">Re-send Pre-Arrival Welcome${domesticSuffix}</button>` : `<button class="btn" disabled style="opacity:.5;">No phone on file</button>`;
        if (tooEarly) return `<button class="btn" disabled style="opacity:.5;">Pre-Arrival Message: Wait closer to arrival</button>`;
        return prearrivalWelcomeWa ? `<button class="btn send-btn" data-wa="${prearrivalWelcomeWa}" data-track-guest="${baseName(repName)}" data-track-field="preArrivalWelcomeSent">Send Pre-Arrival Welcome Message${domesticSuffix}</button>` : `<button class="btn" disabled style="opacity:.5;">No phone on file</button>`;
      })()}
      ${(() => {
        const status = preArrivalWelcomeStatus(repName);
        // Note: 'No Pickup' is informational only here, not disabling — the
        // 5b safe-travels message variant is specifically written for
        // no-pickup guests, so they still need this message, just different content.
        if (status === 'no_pickup') return '<span class="check" style="color:var(--muted);">No Pickup (safe-travels version)</span>';
        if (status === 'sent') return '<span class="check" style="color:var(--green);font-weight:600;">✓ Sent</span>';
        if (status === 'error') return '<span class="check" style="color:#a33;font-weight:600;">⚠ Check status</span>';
        if (tooEarly) return `<span class="check" style="color:var(--muted);">Opens in ${formatTimeRemaining(hoursOutPW - 72)}</span>`;
        return '<span class="check" style="color:var(--muted);">Not marked sent yet</span>';
      })()}
    </div>`;

  const roomCheckedIn = roomCheckedInStatus(room.listNum);
  const checkinCard = `
    <div class="send-row" id="action-checkedin" style="background:${roomCheckedIn ? '#c3e6cb' : '#fff3cd'};border-radius:8px;padding:10px 12px;border-left:5px solid ${roomCheckedIn ? '#1a5c2a' : '#b38600'};">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;">
        <input type="checkbox" class="checkedin-checkbox" data-room="${room.listNum}" ${roomCheckedIn ? 'checked' : ''} style="width:22px;height:22px;flex-shrink:0;">
        <span style="font-weight:700;font-size:14px;color:${roomCheckedIn ? '#1a5c2a' : '#856404'};">${roomCheckedIn ? '✅ GUEST CHECKED IN' : '⏳ NOT CHECKED IN YET'}</span>
      </label>
    </div>
    <div class="info-card">
      <div class="task-title">🏨 Hotel Check-in</div>
      <div class="task-facts">
        <span class="fact-line"><span class="fact-label">Hotel Allocated #:</span> ${room.room}</span>
        <span class="fact-line"><span class="fact-label">Floor:</span> ${room.floor || 'TBC'}</span>
        <span class="fact-line"><span class="fact-label">Room type:</span> ${room.roomType}</span>
        <span class="fact-line"><span class="fact-label">Confirmation #:</span> ${room.confirmation}</span>
      </div>
    </div>`;

  // Send Pre-Departure Reminder (Message #7a/7b) — placed before the
  // Departure section. Disabled with "No dropoff" when Dropoff=N, same
  // pattern as Flight Confirmation. Gated to open 28 hours before the
  // FLIGHT's actual departure time (not leave-hotel time) — if that time
  // isn't on file, the gate is skipped rather than blocking indefinitely.
  const noDropoff = !depLeg || (depLeg.dropoff && depLeg.dropoff.trim().startsWith('N'));
  const hoursOut = depLeg ? hoursUntil(depLeg.date, depLeg.time) : null;
  const depTooEarly = hoursOut !== null && hoursOut > 28;
  const authDepMsg = DATA.wa_departure_msg ? DATA.wa_departure_msg[baseName(repName)] : null;
  const authDepPhone = DATA.wa_departure_phone ? DATA.wa_departure_phone[baseName(repName)] : null;
  const preDepMsg = authDepMsg || MSGS.preDeparture(repName, room, depLeg);
  const preDepWa = waLink(authDepPhone || primaryPhone, preDepMsg);
  const preDepartureRow = `<div class="send-row" id="action-predeparture">
      ${(() => {
        if (noDropoff) return `<button class="btn" disabled style="opacity:.5;">No Pre-Departure Reminder Required - No dropoff</button>`;
        const status = preDepartureReminderStatus(repName);
        if (status === 'no_pickup') return `<button class="btn" disabled style="opacity:.5;">No Pre-Departure Reminder Required - No dropoff</button>`;
        if (status === 'error') return `<button class="btn" disabled style="opacity:.5;">Blocked — check status</button>`;
        if (status === 'sent') return preDepWa ? `<button class="btn send-btn" data-wa="${preDepWa}" data-track-guest="${baseName(repName)}" data-track-field="preDepartureReminderSent" style="background:#8d8a7f;opacity:.75;">Re-send Pre-Departure Reminder</button>` : `<button class="btn" disabled style="opacity:.5;">No phone on file</button>`;
        if (depTooEarly) return `<button class="btn" disabled style="opacity:.5;">Pre-Departure Reminder: Wait closer to departure</button>`;
        return preDepWa ? `<button class="btn send-btn" data-wa="${preDepWa}" data-track-guest="${baseName(repName)}" data-track-field="preDepartureReminderSent">Send Pre-Departure Reminder</button>` : `<button class="btn" disabled style="opacity:.5;">No phone on file</button>`;
      })()}
      ${(() => {
        if (noDropoff) return '';
        const status = preDepartureReminderStatus(repName);
        if (status === 'sent') return '<span class="check" style="color:var(--green);font-weight:600;">✓ Sent</span>';
        if (status === 'error') return '<span class="check" style="color:#a33;font-weight:600;">⚠ Check status</span>';
        if (depTooEarly) return `<span class="check" style="color:var(--muted);">Opens in ${formatTimeRemaining(hoursOut - 28)}</span>`;
        return '<span class="check" style="color:var(--muted);">Not marked sent yet</span>';
      })()}
    </div>`;

  let departureCard = '';
  if (depLeg) {
    const depVanRaw = findVan(repName, 'DEPARTURE');
    // Self-arranged "vehicles" (OWN-XX) aren't a real shared vehicle — don't show a fake van ID for these
    const depVan = (depVanRaw && depVanRaw.vehicle_type !== 'Self-arranged') ? depVanRaw : null;
    const depVanList = depVan ? `
      <ul class="guest-list">
        ${depVan.names.map(n => `<li class="${n===repName?'self':''}">${n}${n===repName?' (this guest)':''} — ${personTag(n)}</li>`).join('')}
      </ul>` : '';
    departureCard = `
      <div class="section-label">🧳 Departure (info only)</div>
      <div class="info-card">
        <div class="task-title">✈ Departure${depVan ? ' — ' + depVan.van_id : ''}</div>
        <ul class="guest-list">
          <li><span class="fact-label">Flight:</span> ${depLeg.airline || 'Own arrangements'} ${depLeg.flightNo || ''}</li>
          <li><span class="fact-label">Route:</span> ${depLeg.origin || ''} → ${depLeg.destination || ''}</li>
          <li><span class="fact-label">Scheduled Departure:</span> ${depLeg.date || 'TBC'}${depLeg.time ? ', ' + depLeg.time : ''}</li>
          <li><span class="fact-label">Estimated Leave-Hotel Time:</span> ${depLeg.dropoff === 'N' ? 'Not needed (own arrangements)' : (depLeg.leaveHotelTime || 'TBC')}</li>
        </ul>
        ${depVan ? `<div class="task-facts"><span class="fact-line"><span class="fact-label">Traveling together (${depVan.van_id}):</span></span></div>${depVanList}` : ''}
      </div>`;
  } else {
    departureCard = `
      <div class="section-label">🧳 Departure (info only)</div>
      <div class="info-card"><div class="task-facts">No departure flight on file for this guest.</div></div>`;
  }

  // Single, unmistakable "what to do next" banner - checked in real-world
  // chronological order (Hotel Conf -> Flight Conf -> Pre-Arrival -> pickup
  // day -> checked-in -> Pre-Departure), skipping anything not yet
  // actionable (gated by timing) rather than treating it as "next."
  let nextAction = null;
  const hStatus = hotelConfirmationStatus(primaryName);
  const fStatus = flightConfirmationStatus(repName);
  const pStatus = preArrivalWelcomeStatus(repName);
  const dStatus = preDepartureReminderStatus(repName);
  // Hotel Confirmation and Flight Confirmation buttons are hidden for now
  // (already sent to everyone, not being re-tracked) - skip straight to
  // Pre-Arrival Welcome as the first real actionable item.
  if (pStatus === 'error') nextAction = { text: 'Pre-Arrival Welcome is blocked — check status', icon: '⚠', color: '#a33', target: 'action-prearrival' };
  else if (!tooEarly && pStatus !== 'sent') nextAction = { text: 'Send Pre-Arrival Welcome Message', icon: '📤', color: '#8a6d1f', target: 'action-prearrival' };
  else if (tooEarly && pStatus !== 'sent') nextAction = { text: `Send Pre Arrival Welcome in ${formatTimeRemaining(hoursOutPW - 72)}`, icon: '⏳', color: '#888', target: null };
  else if (!noPickup && arrLeg && !transportReceivedStatus(repName)) nextAction = { text: 'Mark Transport Received once picked up', icon: '🚐', color: '#8a6d1f', target: 'action-received' };
  else if (!roomCheckedIn) nextAction = { text: 'Mark Guest Checked In once at hotel', icon: '🏨', color: '#8a6d1f', target: 'action-checkedin' };
  else if (dStatus === 'error') nextAction = { text: 'Pre-Departure Reminder is blocked — check status', icon: '⚠', color: '#a33', target: 'action-predeparture' };
  else if (!noDropoff && !depTooEarly && dStatus !== 'sent') nextAction = { text: 'Send Pre-Departure Reminder', icon: '📤', color: '#8a6d1f', target: 'action-predeparture' };
  else if (!noDropoff && depTooEarly && dStatus !== 'sent') nextAction = { text: `Send Pre Departure Reminder in ${formatTimeRemaining(hoursOut - 28)}`, icon: '⏳', color: '#888', target: null };
  else nextAction = { text: 'All caught up for this guest right now', icon: '✅', color: '#1a5c2a', target: null };

  const bannerLabel = nextAction.target ? 'NEXT ACTION' : (nextAction.icon === '✅' ? 'STATUS' : 'UPCOMING');
  const domesticBadge = isDomesticArrival
    ? `<div style="display:inline-block;background:#d6e9f8;color:#1c5a85;font-weight:700;font-size:11px;letter-spacing:0.3px;padding:4px 10px;border-radius:6px;margin-bottom:10px;">✈ DOMESTIC ARRIVAL</div>`
    : '';
  const nextActionBanner = `
    ${domesticBadge}
    <div id="next-action-banner" data-target="${nextAction.target || ''}" data-expand-hotel="${nextAction.expandHotel ? '1' : ''}"
      style="background:#fff;border:2px solid ${nextAction.color};border-radius:8px;padding:12px 14px;margin-bottom:14px;${nextAction.target ? 'cursor:pointer;' : ''}">
      <div style="font-size:11px;font-weight:800;letter-spacing:0.5px;color:${nextAction.color};margin-bottom:2px;">${bannerLabel}${nextAction.target ? ' — TAP TO GO THERE' : ''}</div>
      <div style="font-weight:700;font-size:15px;color:${nextAction.color};">${nextAction.icon} ${nextAction.text}</div>
    </div>`;

  card.style.background = roomCheckedIn ? '#c3e6cb' : '';
  card.style.borderTop = roomCheckedIn ? '6px solid #1a5c2a' : '';
  card.innerHTML = `
    <h2>${headerNames}</h2>
    ${nextActionBanner}

    <div class="section-label">📞 Contact</div>
    ${contactRows}

    <div class="info-card hotel-toggle" id="hotel-section-header" style="cursor:pointer;user-select:none;" onclick="this.nextElementSibling.classList.toggle('collapsed'); this.querySelector('.chevron').textContent = this.nextElementSibling.classList.contains('collapsed') ? '▸' : '▾';">
      <div class="task-title" style="margin-bottom:0;">🏨 Hotel Info &gt;&gt; Click for details <span class="chevron" style="float:right;">▸</span></div>
    </div>
    <div class="hotel-collapsible collapsed">
      <div class="send-row" id="action-hotelconf" style="display:none;">
        ${(() => {
          const status = hotelConfirmationStatus(primaryName);
          if (!hotelWa) return `<button class="btn" disabled style="opacity:.5;">No phone on file</button>`;
          if (status === 'error') return `<button class="btn" disabled style="opacity:.5;">Blocked — check status</button>`;
          if (status === 'sent') return `<button class="btn send-btn" data-wa="${hotelWa}" data-track-guest="${baseName(primaryName)}" data-track-field="hotelConfirmationSent" style="background:#8d8a7f;opacity:.75;">Re-send Hotel Confirmation</button>`;
          return `<button class="btn send-btn" data-wa="${hotelWa}" data-track-guest="${baseName(primaryName)}" data-track-field="hotelConfirmationSent">Send Hotel Confirmation</button>`;
        })()}
        ${(() => {
          const status = hotelConfirmationStatus(primaryName);
          if (status === 'sent') return '<span class="check" style="color:var(--green);font-weight:600;">✓ Sent</span>';
          if (status === 'error') return '<span class="check" style="color:#a33;font-weight:600;">⚠ Check status</span>';
          return '<span class="check" style="color:var(--muted);">Not marked sent yet</span>';
        })()}
      </div>
      ${hotelHTML}
    </div>

    ${flightConfRow}
    ${flightArrivalCard}
    ${preArrivalWelcomeRow}
    ${transportPickupCard}
    ${checkinCard}

    ${preDepartureRow}
    ${departureCard}

    <div class="card-nav">
      <button onclick="navigateGuest(-1)" ${(() => { const seq = buildGuestSequence(); const idx = seq.findIndex(g => g.listNum === listNum && g.name === repName); return idx <= 0 ? 'disabled' : ''; })()}>◀ Previous</button>
      <span class="nav-pos">Guest List #${listNum} · ${(() => { const seq = buildGuestSequence(); const idx = seq.findIndex(g => g.listNum === listNum && g.name === repName); return (idx + 1) + ' of ' + seq.length; })()}</span>
      <button onclick="navigateGuest(1)" ${(() => { const seq = buildGuestSequence(); const idx = seq.findIndex(g => g.listNum === listNum && g.name === repName); return idx === seq.length - 1 ? 'disabled' : ''; })()}>Next ▶</button>
    </div>
  `;
  card.classList.add('show');
}
function allOccupantsOf(room) {
  const names = room.guests.map(g => g[1]);
  if (room.child) names.push(...splitNames(room.child[1]));
  if (room.infant) names.push(...splitNames(room.infant[0]));
  return names.length ? names : ['Guest'];
}
function buildGuestSequence() {
  const seq = [];
  ROOM_ORDER.forEach(listNum => {
    const room = DATA.rooms.find(r => r.listNum === listNum);
    allOccupantsOf(room).forEach(name => seq.push({ listNum, name }));
  });
  return seq;
}
function navigateGuest(step) {
  const seq = buildGuestSequence();
  const focusName = focusedOccupant(DATA.rooms.find(r => r.listNum === currentListNum));
  let idx = seq.findIndex(g => g.listNum === currentListNum && g.name === focusName);
  if (idx === -1) idx = seq.findIndex(g => g.listNum === currentListNum); // fallback if focus name is odd
  const next = idx + step;
  if (next < 0 || next >= seq.length) return;
  renderCard(seq[next].listNum, seq[next].name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleDone(input, cardId) {
  document.getElementById(cardId).classList.toggle('done', input.checked);
}

document.getElementById('searchInput').addEventListener('input', (e) => renderSearchResults(e.target.value));
loadStatus();
// Deep-linking support: ?list=16&name=Lalit%20Gupta&expandHotel=1
(function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const listParam = params.get('list');
  const nameParam = params.get('name');
  if (listParam) {
    renderCard(parseInt(listParam), nameParam || undefined);
    if (params.get('expandHotel') === '1') {
      setTimeout(() => {
        const collapsible = document.querySelector('.hotel-collapsible');
        const header = document.getElementById('hotel-section-header');
        if (collapsible && collapsible.classList.contains('collapsed')) {
          collapsible.classList.remove('collapsed');
          if (header) { const chev = header.querySelector('.chevron'); if (chev) chev.textContent = '▾'; }
        }
      }, 0);
    }
  }
})();
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) document.getElementById('searchResults').classList.remove('show');
});
</script>
</body>
</html>
