<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tracker Summary</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f7f5f2; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  .controls { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; flex: 1; min-width: 160px; }
  select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #2c2416; color: white; position: sticky; top: 0; cursor: pointer; }
  tr:hover { background: #faf8f5; }
  .yes { background: #d4edda; color: #1a5c2a; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .no { background: #f0f0f0; color: #888; padding: 2px 8px; border-radius: 10px; }
  .err { background: #f8d7da; color: #842029; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .nopickup { background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 10px; }
  .checked { background: #d4edda; }
  .count { font-size: 12px; color: #555; margin-left: 8px; }
  .table-wrap { overflow-x: auto; max-height: 80vh; overflow-y: auto; }
  .statusSelect { font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
  .statusSelect.yes { background: #d4edda; color: #1a5c2a; font-weight: 600; }
  .statusSelect.no { background: #f0f0f0; color: #888; }
  .statusSelect.err { background: #f8d7da; color: #842029; font-weight: 600; }
  .statusSelect.nopickup { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
<h1>Guest Comms Tracker — Summary</h1>
<div class="sub">Live from the same backend as the portal. Refresh this page anytime for the latest.</div>
<div class="controls">
  <input type="text" id="filterInput" placeholder="Search guest name or room...">
  <select id="filterCol">
    <option value="">Show all</option>
    <option value="hotel">Hotel Confirmation</option>
    <option value="flight">Flight Confirmation</option>
    <option value="prearrival">Pre-Arrival Welcome</option>
    <option value="predep">Pre-Departure Reminder</option>
    <option value="received">Transport Received</option>
    <option value="checkedin">Room Checked In</option>
  </select>
  <select id="filterVal"></select>
  <button onclick="location.reload()">↻ Refresh</button>
  <button onclick="downloadExcel()">⬇ Download Excel</button>
  <span class="count" id="resultCount"></span>
</div>
<div class="table-wrap">
<table id="tbl">
  <thead>
    <tr>
      <th onclick="sortBy('room')">List #</th>
      <th onclick="sortBy('name')">Guest</th>
      <th onclick="sortBy('subgroup')">Subgroup</th>
      <th onclick="sortBy('hotel')">Hotel Conf</th>
      <th onclick="sortBy('flight')">Flight Conf</th>
      <th onclick="sortBy('prearrival')">Pre-Arrival</th>
      <th onclick="sortBy('predep')">Pre-Departure</th>
      <th onclick="sortBy('received')">Transport Received</th>
      <th onclick="sortBy('checkedin')">Room Checked In</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

function baseName(n) { return n.replace(/\s*\([^)]*\)\s*$/, '').trim(); }

function statusClass(v) {
  v = (v || '').toLowerCase();
  if (v.startsWith('yes')) return { cls: 'yes', label: 'Sent' };
  if (v.startsWith('error')) return { cls: 'err', label: 'Error' };
  if (v.replace(/[\s-]/g,'') === 'nopickup') return { cls: 'nopickup', label: 'No Pickup' };
  if (v.replace(/[\s-]/g,'') === 'nodropoff') return { cls: 'nopickup', label: 'No Dropoff' };
  return { cls: 'no', label: 'Not sent' };
}

const FIELD_MAP = { hotel: 'hotelConfirmationSent', flight: 'flightConfirmationSent', prearrival: 'preArrivalWelcomeSent', predep: 'preDepartureReminderSent' };
const OPTIONS_MAP = {
  hotel: ['Ok to send', 'Yes-Sent', 'Error wait'],
  flight: ['Ok to send', 'Yes-Sent', 'Error wait', 'No Pickup'],
  prearrival: ['Ok to send', 'Yes-Sent', 'Error wait', 'No Pickup'],
  predep: ['Ok to send', 'Yes-Sent', 'Error wait', 'No Dropoff'],
};

async function updateStatus(guestName, col, value) {
  const key = baseName(guestName);
  await fetch('/.netlify/functions/update-tracker', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ type: 'message', guestName: key, field: FIELD_MAP[col], value }),
  }).catch(e => console.warn('update failed', e));
  ROWS.forEach(r => { if (baseName(r.name) === key) r[col] = value; });
  render();
}

async function updateBool(name, listNum, col, checked) {
  const key = baseName(name);
  if (col === 'received') {
    await fetch('/.netlify/functions/update-tracker', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ type: 'transportReceived', guestName: key, value: checked }),
    }).catch(e => console.warn('update failed', e));
    ROWS.forEach(r => { if (baseName(r.name) === key) r.received = checked; });
  } else {
    await fetch('/.netlify/functions/update-tracker', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ type: 'roomCheckedIn', listNum, value: checked }),
    }).catch(e => console.warn('update failed', e));
    // Per-room: applies to every guest sharing this room, not just the one clicked
    ROWS.forEach(r => { if (r.room === listNum) r.checkedin = checked; });
  }
  render();
}

let ROWS = [];
let sortState = { col: 'room', dir: 1 };

async function load() {
  const res = await fetch('/.netlify/functions/get-tracker', { cache: 'no-store' });
  const data = await res.json();

  ROWS = [];
  ROOMS.forEach(r => {
    r.names.forEach(name => {
      const key = baseName(name);
      const msg = (data.messages && data.messages[key]) || {};
      ROWS.push({
        room: r.listNum, roomLabel: r.room, subgroup: r.subgroup, name: name,
        hotel: msg.hotelConfirmationSent, flight: msg.flightConfirmationSent,
        prearrival: msg.preArrivalWelcomeSent, predep: msg.preDepartureReminderSent,
        received: !!(data.transportReceived && data.transportReceived[key]),
        checkedin: !!(data.roomCheckedIn && data.roomCheckedIn[String(r.listNum)]),
      });
    });
  });
  render();
}

const BOOL_COLS = ['received', 'checkedin'];

function updateFilterValOptions() {
  const col = document.getElementById('filterCol').value;
  const sel = document.getElementById('filterVal');
  if (BOOL_COLS.includes(col)) {
    sel.innerHTML = `<option value="">Either</option><option value="done">Done</option><option value="pending">Still pending</option>`;
  } else {
    sel.innerHTML = `<option value="">Any status</option><option value="sent">Sent</option><option value="not_sent">Not sent yet</option><option value="error">Error/Blocked</option>`;
  }
}

function render() {
  const q = document.getElementById('filterInput').value.trim().toLowerCase();
  const col = document.getElementById('filterCol').value;
  const val = document.getElementById('filterVal').value;

  let rows = ROWS.filter(r => {
    if (q && !(r.name.toLowerCase().includes(q) || String(r.room).includes(q) || r.roomLabel.toLowerCase().includes(q))) return false;
    if (col && val) {
      if (BOOL_COLS.includes(col)) {
        const isDone = !!r[col];
        if (val === 'done' && !isDone) return false;
        if (val === 'pending' && isDone) return false;
      } else {
        const sc = statusClass(r[col]);
        const want = val === 'sent' ? 'yes' : val === 'error' ? 'err' : 'no';
        if (sc.cls !== want && !(want === 'no' && sc.cls === 'nopickup')) return false;
      }
    }
    return true;
  });

  rows.sort((a, b) => {
    const c = sortState.col;
    const av = a[c], bv = b[c];
    if (typeof av === 'boolean') return (av === bv ? 0 : av ? -1 : 1) * sortState.dir;
    return String(av).localeCompare(String(bv)) * sortState.dir;
  });

  document.getElementById('resultCount').textContent = rows.length + ' of ' + ROWS.length + ' guest rows';
  window.CURRENT_ROWS = rows; // used by downloadExcel()

  document.getElementById('tbody').innerHTML = rows.map(r => {
    const h = statusClass(r.hotel), f = statusClass(r.flight), p = statusClass(r.prearrival), d = statusClass(r.predep);
    const selectHtml = (col, current, cls) => {
      const opts = OPTIONS_MAP[col];
      const currentVal = current || 'Ok to send';
      const optsHtml = opts.map(o => `<option value="${o}" ${o === currentVal ? 'selected' : ''}>${o}</option>`).join('');
      return `<select class="statusSelect ${cls}" onchange="updateStatus('${r.name.replace(/'/g,"\\'")}', '${col}', this.value)">${optsHtml}</select>`;
    };
    return `<tr class="${r.checkedin ? 'checked' : ''}">
      <td>${r.room} (Rm ${r.roomLabel})</td>
      <td>${r.name}</td>
      <td>${r.subgroup}</td>
      <td>${selectHtml('hotel', r.hotel, h.cls)}</td>
      <td>${selectHtml('flight', r.flight, f.cls)}</td>
      <td>${selectHtml('prearrival', r.prearrival, p.cls)}</td>
      <td>${selectHtml('predep', r.predep, d.cls)}</td>
      <td><label style="cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" ${r.received ? 'checked' : ''} onchange="updateBool('${r.name.replace(/'/g,"\\'")}', ${r.room}, 'received', this.checked)">
        ${r.received ? '<span class="yes">✓ Received</span>' : '<span class="no">Not yet</span>'}
      </label></td>
      <td><label style="cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" ${r.checkedin ? 'checked' : ''} onchange="updateBool('${r.name.replace(/'/g,"\\'")}', ${r.room}, 'checkedin', this.checked)">
        ${r.checkedin ? '<span class="yes">✓ Checked in</span>' : '<span class="no">Not yet</span>'}
      </label></td>
    </tr>`;
  }).join('');
}

function downloadExcel() {
  const rows = window.CURRENT_ROWS || ROWS;
  const data = rows.map(r => ({
    'List #': r.room,
    'Room': r.roomLabel,
    'Guest': r.name,
    'Subgroup': r.subgroup,
    'Hotel Confirmation': statusClass(r.hotel).label,
    'Flight Confirmation': statusClass(r.flight).label,
    'Pre-Arrival Welcome': statusClass(r.prearrival).label,
    'Pre-Departure Reminder': statusClass(r.predep).label,
    'Transport Received': r.received ? 'Yes' : 'No',
    'Room Checked In': r.checkedin ? 'Yes' : 'No',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tracker Status');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '');
  XLSX.writeFile(wb, `Guest_Tracker_Status_${stamp}.xlsx`);
}

function sortBy(col) {
  sortState.dir = (sortState.col === col) ? -sortState.dir : 1;
  sortState.col = col;
  render();
}

document.getElementById('filterInput').addEventListener('input', render);
document.getElementById('filterCol').addEventListener('change', () => { updateFilterValOptions(); render(); });
document.getElementById('filterVal').addEventListener('change', render);
updateFilterValOptions();
load();
</script>
</body>
